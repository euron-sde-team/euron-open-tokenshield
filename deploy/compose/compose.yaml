# ─────────────────────────────────────────────────────────────────────────────
# Euron TokenShield: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 4110   api 4130   mock-llm 4150   postgres 4142   redis 4179   floci 4166
# ─────────────────────────────────────────────────────────────────────────────
name: tokenshield

x-api-image: &api-image
  build:
    context: ../../apps/api
    dockerfile: ../../infra/docker/api.Dockerfile
  image: tokenshield-api:local

x-api-env: &api-env
  # Development mode keeps the production guards as warnings: the local stack talks to
  # an emulator and links to localhost, both of which production refuses on purpose.
  ENVIRONMENT: development
  TOKENSHIELD_CLOUD: local
  LOG_LEVEL: ${TS_LOG_LEVEL:-INFO}
  PORT: "8080"
  DATABASE_URL: postgresql+asyncpg://tokenshield:tokenshield@postgres:5432/tokenshield
  REDIS_URL: redis://redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET:?run `make env` first}
  API_KEY_PEPPER: ${API_KEY_PEPPER:?run `make env` first}
  LOCAL_MASTER_KEY: ${LOCAL_MASTER_KEY:?run `make env` first}
  KEY_MODE: local
  STORAGE: local
  # Shared by api (download) and worker (writes exports); the Floci overlay switches to S3.
  LOCAL_STORAGE_DIR: /data/exports
  COOKIE_SECURE: "false"
  CORS_ORIGINS: http://localhost:${TS_WEB_PORT:-4110},http://127.0.0.1:${TS_WEB_PORT:-4110}
  SEMANTIC_CACHE: ${TS_SEMANTIC_CACHE:-false}
  # `tokenshield seed-demo` sends its live traffic through the gateway on the Compose
  # network, and registers providers pointing at the mock upstream.
  TOKENSHIELD_API_URL: http://api:8080
  MOCK_LLM_URL: http://mock-llm:4150
  TS_DEMO_PASSWORD: ${TS_DEMO_PASSWORD:?run `make env` first}

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: tokenshield
      POSTGRES_USER: tokenshield
      POSTGRES_PASSWORD: tokenshield
    ports:
      - "127.0.0.1:${TS_PG_PORT:-4142}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenshield -d tokenshield"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Budget counters and reservations live here: the append-only file survives a
  # container restart, and noeviction matches the AWS cache module (a full cache
  # refuses writes and hard budgets fail closed, instead of silently dropping counters).
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${TS_REDIS_PORT:-4179}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Deterministic OpenAI- and Anthropic-compatible upstream for the demo and the tests.
  # Demo providers point at http://mock-llm:4150/v1 (OpenAI) and http://mock-llm:4150
  # (Anthropic Messages). Call counts: GET http://localhost:4150/stats
  mock-llm:
    <<: *api-image
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["uvicorn", "mockllm.app:app", "--host", "0.0.0.0", "--port", "4150"]
    ports:
      - "127.0.0.1:${TS_MOCK_LLM_PORT:-4150}:4150"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4150/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: apply Alembic migrations (pgvector extension included) before anything
  # that reads the schema starts.
  migrate:
    <<: *api-image
    command: ["migrate"]
    environment:
      <<: *api-env
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${TS_API_PORT:-4130}:8080"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - exports:/data/exports
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *api-image
    command: ["worker"]
    environment:
      <<: *api-env
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - exports:/data/exports
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    image: tokenshield-web:local
    environment:
      # Server-side only: Next rewrites /api/* and /v1/* to the API on the Compose
      # network, so the browser talks to one origin (no CORS, first-party cookies).
      API_INTERNAL_URL: http://api:8080
      PORT: "8080"
    ports:
      - "127.0.0.1:${TS_WEB_PORT:-4110}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  exports:
