      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        scope_type:
          type: string
          enum:
          - global
          - team
          - project
          - api_key
          - end_user
          - model
          title: Scope Type
        scope_id:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Scope Id
          description: Team/project/key id, end-user id ('*' = each user separately), or model alias
        period:
          type: string
          enum:
          - daily
          - weekly
          - monthly
          - total
          title: Period
        limit_usd:
          anyOf:
          - type: number
            maximum: 10000000.0
            exclusiveMinimum: 0.0
          - type: string
          title: Limit Usd
        mode:
          type: string
          enum:
          - hard
          - soft
          title: Mode
          default: hard
        alert_threshold_pct:
          type: integer
          maximum: 100.0
          minimum: 1.0
