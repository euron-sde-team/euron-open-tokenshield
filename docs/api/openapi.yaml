openapi: 3.1.0
info:
  title: Euron Open TokenShield
  description: '

    Self-hosted AI gateway. Point any OpenAI SDK at `/v1` with a TokenShield key; every request

    is attributed, priced, checked against hard budgets and waste policies, served from cache

    when safe, and recorded.


    The `/api/v1` endpoints power the dashboard and are available to automation with a session

    token (`POST /api/v1/auth/login`).

    '
  version: 0.1.0
paths:
  /v1/chat/completions:
    post:
      tags:
      - gateway
      summary: Create a chat completion (OpenAI-compatible)
      operationId: chat_completions_v1_chat_completions_post
      responses:
        '200':
          description: An OpenAI chat.completion object, or an SSE stream when stream=true
          content:
            application/json:
              schema: {}
  /v1/embeddings:
    post:
      tags:
      - gateway
      summary: Create embeddings (OpenAI-compatible)
      operationId: embeddings_v1_embeddings_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/models:
    get:
      tags:
      - gateway
      summary: List models available to this key
      operationId: list_models_v1_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Models V1 Models Get
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Sign in to the dashboard
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
