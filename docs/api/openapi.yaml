            format: uuid
          - type: 'null'
          title: Actor Id
        actor_email:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor Email
        action:
          type: string
          title: Action
        target_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Type
        target_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Id
        details:
          additionalProperties: true
          type: object
          title: Details
        ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip
      type: object
      required:
      - id
      - at
      - actor_id
      - actor_email
      - action
      - target_type
      - target_id
      - details
      - ip
