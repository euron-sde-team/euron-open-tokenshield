        scope_label:
          anyOf:
          - type: string
          - type: 'null'
          title: Scope Label
        period:
          type: string
          title: Period
        limit_usd:
          type: number
          title: Limit Usd
        mode:
          type: string
          title: Mode
        alert_threshold_pct:
          type: integer
          title: Alert Threshold Pct
        enabled:
          type: boolean
          title: Enabled
